name: RADNET
description: >-
  RadNet, Inc. (NASDAQ: RDNT) is the largest provider of freestanding, fixed-site
  outpatient diagnostic imaging services in the United States, operating roughly
  440 imaging centers offering MRI, CT, PET/CT, ultrasound, mammography, and other
  modalities. Beyond its clinical network, RadNet runs a health-technology business
  spanning eRAD (web-based, cloud imaging workflow, PACS and RIS solutions) and
  DeepHealth, its AI and digital-health division whose cloud-native "DeepHealth OS"
  unifies enterprise imaging (Diagnostic Suite, Operations Suite, TechLive) with
  AI-powered population-health screening for breast, lung, prostate, neuro, and
  thyroid imaging. RadNet was surfaced as a portfolio company of Battery Ventures
  and profiled in the API Evangelist network. RadNet does not publish a public
  developer API or developer portal; its technology is delivered as enterprise
  imaging platforms and AI products through eRAD and DeepHealth.
